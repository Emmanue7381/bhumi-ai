<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="topLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="midLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="botLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- 3D Cadastral GIS Layers (Emblem) -->
  <!-- Bottom Layer (Geodetic Base / Amber) -->
  <path d="M14 44 L32 53 L50 44 L32 35 Z" fill="url(#botLayer)" opacity="0.85" />
  <path d="M14 44 L32 53 L32 56 L14 47 Z" fill="#b45309" opacity="0.9" />
  <path d="M50 44 L32 53 L32 56 L50 47 Z" fill="#78350f" opacity="0.9" />

  <!-- Middle Layer (Spatial GIS Contour / Emerald) -->
  <path d="M14 32 L32 41 L50 32 L32 23 Z" fill="url(#midLayer)" opacity="0.9" />
  <path d="M14 32 L32 41 L32 44 L14 35 Z" fill="#047857" opacity="0.95" />
  <path d="M50 32 L32 41 L32 44 L50 35 Z" fill="#065f46" opacity="0.95" />

  <!-- Top Layer (Cadastral Parcel Map / Cyan) -->
  <path d="M14 20 L32 29 L50 20 L32 11 Z" fill="url(#topLayer)" filter="url(#glow)" />
  <path d="M14 20 L32 29 L32 32 L14 23 Z" fill="#0369a1" />
  <path d="M50 20 L32 29 L32 32 L50 23 Z" fill="#075985" />

  <!-- Parcel Subdivision Grid Lines on Top Surface -->
  <line x1="32" y1="11" x2="32" y2="29" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 1" opacity="0.8" />
  <line x1="23" y1="15.5" x2="41" y2="24.5" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 1" opacity="0.8" />

  <!-- Center Verification Pin / Node -->
  <circle cx="32" cy="20" r="2.5" fill="#ffffff" filter="url(#glow)" />
</svg>
